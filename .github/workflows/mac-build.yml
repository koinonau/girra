name: macOS Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-latest
    # Why 90: the notary queue is the unbounded part, and the install retry budget
    # below can add 30 on its own.
    timeout-minutes: 90
    env:
      # Why: Vite's web build crosses Node's default old-space ceiling on the
      # macOS runner and leaves an incomplete build.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      # Caches the Electron binary and the electron-builder tool downloads,
      # notarytool included.
      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why retry: electron's postinstall downloads its binary from GitHub release
      # assets, and that CDN returns occasional 504s.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why here: a missing credential must fail in seconds rather than after a
      # twenty-minute build.
      - name: Verify macOS signing environment
        run: node config/scripts/verify-macos-release-env.mjs
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Why: `plutil -lint` accepts duplicate plist keys, but `codesign` rejects
      # duplicate entitlements after the expensive app build.
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Build app
        run: pnpm build:release

      # GIRRA_MAC_RELEASE turns on the hardened runtime, forceCodeSigning and
      # notarization; @electron/notarize staples the ticket onto the .app.
      # Why arm64 only: macos-latest is an Apple Silicon runner, so a second
      # architecture would cross-compile every native module for no local use.
      - name: Package signed and notarized DMG
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron && GIRRA_MAC_RELEASE=1 pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Why all three: the notary service authenticates with the app-specific
          # password, not with the signing certificate.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify the DMG carries a notarization ticket
        run: |
          set -euo pipefail
          dmg="$(ls dist/girra-macos-arm64.dmg)"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/girra-dmg "$dmg"
          spctl --assess --type execute --verbose /tmp/girra-dmg/Girra.app
          xcrun stapler validate /tmp/girra-dmg/Girra.app
          hdiutil detach /tmp/girra-dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: girra-macos-arm64
          path: dist/girra-macos-arm64.dmg
          retention-days: 14
          if-no-files-found: error

      # Why guarded on main: a dispatch from a feature branch is a test build, and
      # a release tag cut from one would name a commit that never reached the trunk.
      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          gh release upload "$tag" dist/girra-macos-arm64.dmg --clobber
